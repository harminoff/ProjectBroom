name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-and-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-test.txt
      - name: Audit public source
        shell: powershell
        run: .\scripts\audit-public-tree.ps1
      - name: Resource and map compiler tests
        run: python -m unittest tools.test_engine_source tools.test_broguedoom_resources tools.monster_models.test_rat tools.monster_models.test_rat_animation tools.monster_models.test_creatures tools.weapon_models.test_viewmodel tools.weapon_models.test_devices tools.pickup_models.test_detailed tools.mapcompiler.test_compile
      - name: Compile launcher
        run: dotnet build tools\BrogueDoomLauncher\BrogueDoomLauncher.csproj -c Release --nologo

  native-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build Brogue bridge
        shell: powershell
        run: .\scripts\build-bridge.ps1
      - name: Bridge deterministic tests
        run: python -m unittest tools.test_brogue_bridge
      - name: Long-run bridge smoke
        shell: powershell
        run: .\scripts\run-bridge-test.ps1 -Seed 1 -LongRun 300
